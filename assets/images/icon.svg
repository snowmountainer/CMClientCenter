<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgGrad)" stroke="#334155" stroke-width="4" />

  <path d="M 32 128 L 480 128 M 32 256 L 480 256 M 32 384 L 480 384 M 128 32 L 128 480 M 256 32 L 256 480 M 384 32 L 384 480" stroke="#1e293b" stroke-width="2" />

  <g id="gear" fill="none" stroke="#475569" stroke-width="24" stroke-dasharray="28 20" transform="translate(256, 230)">
    <circle r="110" />
  </g>
  <circle cx="256" cy="230" r="110" fill="none" stroke="#334155" stroke-width="8" />

  <g id="monitor">
    <path d="M 216 400 L 300 400 M 240 350 L 220 400 M 272 350 L 292 400" stroke="#64748b" stroke-width="12" stroke-linecap="round" fill="none" />
    <rect x="112" y="110" width="288" height="240" rx="24" fill="none" stroke="url(#accentGrad)" stroke-width="16" filter="url(#glow)" />
    <rect x="132" y="130" width="248" height="200" rx="12" fill="none" stroke="#0f172a" stroke-width="6" />
  </g>

  <g id="target" transform="translate(256, 230)">
    <line x1="-40" y1="0" x2="40" y2="0" stroke="#22d3ee" stroke-width="6" stroke-linecap="round" />
    <line x1="0" y1="-40" x2="0" y2="40" stroke="#22d3ee" stroke-width="6" stroke-linecap="round" />
    <circle cx="0" cy="0" r="14" fill="#38bdf8" />
    <circle cx="0" cy="0" r="28" fill="none" stroke="#22d3ee" stroke-width="4" stroke-dasharray="6 6" />
  </g>

  <circle cx="370" cy="320" r="18" fill="#0f172a" />
  <circle cx="370" cy="320" r="12" fill="#10b981" />
</svg>
